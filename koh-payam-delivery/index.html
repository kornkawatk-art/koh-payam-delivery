<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="จัดส่งเกาะ" />
    <meta name="description" content="ระบบจัดส่งสินค้าเกาะพยามและเกาะช้าง — แพ็ก ลงเรือ และติดตามสถานะ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Island Delivery</title>
    <!-- Apply a stored dark theme before the app loads (no light flash on
         reload). Same rules as src/lib/theme.ts: only team pages; login, 2FA,
         customer and LINE pages are always light. AppShell takes over after. -->
    <script id="theme-boot">
      try {
        var p = location.pathname
        var light = /^\/(login|2fa|o|help|liff)(\/|$)/.test(p)
        if (!light && localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#121212')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
